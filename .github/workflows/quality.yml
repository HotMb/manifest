name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts-and-orchestration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Node tooling if locked
        run: |
          if [ -f package-lock.json ]; then npm ci; fi
      - name: Install contract tooling
        run: python -m pip install -r requirements-dev.txt
      - name: Orchestration tests
        run: npm test
      - name: Repository consistency
        run: npm run check
      - name: TypeScript workspaces
        run: npm run typecheck
      - name: Build the shared editor view
        run: npm run build
      - name: M0 domain and MCP tests
        run: npm run test:m0
      - name: Install Chromium for UI tests
        run: npx playwright install --with-deps chromium
      - name: Browser qualification tests
        run: npm run test:e2e
      - name: Contract validation
        run: python scripts/check_contracts.py
      - name: Contract mutation tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
