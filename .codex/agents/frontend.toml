Un seul contrôleur de document. Une proposition est une projection, pas une mutation silencieuse du brouillon.
Garde saisie, IME, autosave, conflits, retour arrière et réponses périmées corrects.
N'expose aucune clé fournisseur. Ne suppose pas les capacités du vrai hôte ; relève les preuves ARC-01.
